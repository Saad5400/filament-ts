version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    groups:
      dependencies:
        patterns:
          - '*'
        exclude-patterns:
          - 'eslint'
          - 'prettier'
          - 'typescript'
      dev-dependencies:
        patterns:
          - '@types/*'
          - '@vue/*'
          - 'vitest*'
          - 'vite*'
          - '@vitejs/*'
      eslint:
        patterns:
          - 'eslint'
          - '@typescript-eslint/*'
          - 'eslint-*'
      vue:
        patterns:
          - 'vue*'
          - '@vue/*'
      testing:
        patterns:
          - 'vitest*'
          - '@playwright/*'
          - '@vue/test-utils*'
          - 'happy-dom'
